<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>METABYTE Gaming</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#030816;color:#eaf4ff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
:root{--cyan:#00d9ff;--blue:#246bff;--purple:#8b2cff;--pink:#f020d0;--panel:#071329;--line:#12315a}
.app{min-height:100vh;background:radial-gradient(circle at 50% 25%,#111b52 0,#050b1d 42%,#020610 100%)}
header{height:74px;border-bottom:1px solid #16427a;background:#040b19e8;display:flex;align-items:center;padding:0 28px;gap:18px;box-shadow:0 0 30px #001d45}
.pokeball{font-size:34px} .brandLogo{width:185px;height:50px;object-fit:contain;border-radius:10px}
.divider{height:34px;width:1px;background:#31517e} header h1{margin:0;color:#4edfff;letter-spacing:3px;font-size:25px} header span{color:#9bb9df}
.topRight{margin-left:auto;display:flex;align-items:center;gap:20px;color:#b9d6ff}
.layout{display:grid;grid-template-columns:245px 1fr 390px;gap:18px;padding:18px}
.sidebar,.panel{background:linear-gradient(145deg,#08172d,#040c1c);border:1px solid #164477;border-radius:17px;box-shadow:0 0 25px #001c3b80}
.sidebar{padding:16px;min-height:calc(100vh - 110px);display:flex;flex-direction:column}
.nav{padding:14px 15px;margin:5px 0;border-radius:12px;color:#8fc4ff;cursor:pointer;transition:.2s;display:flex;gap:12px;align-items:center}
.nav:hover,.nav.active{background:linear-gradient(90deg,#078cff,#7d22ee);color:white;box-shadow:0 0 18px #5a2cff77}
.spacer{flex:1} .quote{padding:25px 12px;text-align:center;border:1px solid #174e8b;border-radius:14px;color:#16cfff;font-weight:bold;line-height:1.5}
main{min-width:0} .hero{height:410px;border:1px solid #15508a;border-radius:17px;position:relative;overflow:hidden;background:
radial-gradient(circle at 30% 50%,#063f8c 0,transparent 35%),
radial-gradient(circle at 70% 50%,#710099 0,transparent 38%),#030816;display:flex;align-items:center;justify-content:center}
.hero:before,.hero:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(55px);opacity:.28}
.hero:before{background:#008cff;left:-130px} .hero:after{background:#ef00d5;right:-130px}
.mon{position:absolute;font-size:210px;opacity:.12;filter:drop-shadow(0 0 15px #6d5cff)} .mon.left{left:15px} .mon.right{right:15px}
.logoBox{z-index:2;width:430px;height:280px;border:2px solid #b41cff;border-radius:40px;display:flex;align-items:center;justify-content:center;background:#02040dba;box-shadow:0 0 25px #00cfff,0 0 65px #a000ff}
.logoBox img{width:82%;max-height:82%;object-fit:contain;image-rendering:auto}
.heroBottom{position:absolute;bottom:22px;z-index:3;color:#68eaff;letter-spacing:7px;font-weight:bold}
.previewSize{position:absolute;right:18px;top:18px;z-index:5;background:#071329;border:1px solid #235389;border-radius:12px;padding:10px}
button{border:0;color:#dff5ff;background:#0b1e39;border:1px solid #1c548c;border-radius:10px;padding:11px 15px;cursor:pointer}
button:hover{background:#173b6c} .primary{background:linear-gradient(90deg,#007cff,#7928e8);border:0}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.panel{padding:18px} .panel h2{font-size:16px;margin:0 0 17px;letter-spacing:.5px} label{display:block;font-size:13px;color:#9bc6f7;margin:12px 0 6px}
input[type=text],select{width:100%;padding:12px;border-radius:9px;border:1px solid #214b78;background:#020a17;color:#fff;outline:none}
input[type=text]:focus,select:focus{border-color:#00cfff;box-shadow:0 0 12px #00bfff55}
.swatches{display:flex;gap:9px;flex-wrap:wrap} .swatch{width:27px;height:27px;border-radius:50%;border:2px solid #fff5;cursor:pointer}
.range{width:100%;accent-color:#8d2dff}
.elements{display:flex;gap:8px} .element{font-size:21px;padding:8px 10px;border-radius:9px;border:1px solid #244e7d;cursor:pointer}
.element.selected{background:#5d25d8;box-shadow:0 0 12px #a62cff}
.bgGrid,.presetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px} .thumb{height:58px;border-radius:9px;border:1px solid #275987;cursor:pointer}
.bg1{background:linear-gradient(135deg,#007cff,#8400ff)} .bg2{background:radial-gradient(circle,#a900ff,#08001c)} .bg3{background:linear-gradient(135deg,#ff3b00,#220000)} .bg4{background:linear-gradient(135deg,#00d889,#001d1c)}
.preset{height:100px;border-radius:12px;border:1px solid #24517f;display:flex;align-items:center;justify-content:center;background:#020715;cursor:pointer;overflow:hidden}
.preset img{width:90%;height:90%;object-fit:contain} .preset:hover{border-color:#c02cff;box-shadow:0 0 16px #9d2cff66}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px} .actions button:last-child{grid-column:1/-1}
.previewCard{display:flex;gap:15px;align-items:center;background:#020917;border:1px solid #173f69;border-radius:14px;padding:15px}
.previewCard img{width:85px;height:85px;object-fit:contain;border-radius:15px;background:#02030a}
footer{height:55px;border-top:1px solid #173f6c;text-align:center;padding:17px;color:#62dfff;letter-spacing:4px}
@media(max-width:1100px){.layout{grid-template-columns:210px 1fr}aside.right{grid-column:1/-1}} 
@media(max-width:760px){header{padding:0 12px}header span,.divider{display:none}.layout{grid-template-columns:1fr;padding:10px}.sidebar{min-height:auto}.controls{grid-template-columns:1fr}.brandLogo{width:145px}.hero{height:330px}.logoBox{width:75%;height:220px}}
</style>
</head>
